  <script>
        // Function to set the city ID based on the URL hash
        function setCityIdFromHash() {
            const cityId = window.location.hash ? window.location.hash.slice(1) : '1';
            document.getElementById('citySelector').value = cityId;
        }

        // Listen for hash changes
        window.addEventListener('hashchange', setCityIdFromHash);

        // Call setCityIdFromHash on initial load
        setCityIdFromHash();
    </script>
