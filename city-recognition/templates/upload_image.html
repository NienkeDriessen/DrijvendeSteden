<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Image</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='bootstrap/css/bootstrap.min.css') }}">
</head>
<body>
    <div class="container" style="margin-top: 1cm;">
        <h1>Upload City Image</h1>
        {% with messages = get_flashed_messages(with_categories=true) %}
            {% if messages %}
                {% for category, message in messages %}
                    <div class="alert alert-{{ category }}">
                        {{ message }}
                    </div>
                {% endfor %}
            {% endif %}
        {% endwith %}
        <form action="/" method="POST" enctype="multipart/form-data">
            <div class="form-group" style="margin-bottom:0.5cm;">
                <label for="city_name">Type a name for your city (Must be between 6-12 alpha-numeric characters)</label>
                <input 
                    type="text" 
                    class="form-control" 
                    id="city_name" 
                    name="city_name" 
                    required
                    pattern="^[a-zA-Z0-9]{6,12}$"
                    title="City name must be between 6 and 12 alphanumeric characters"
                >
            </div>
            <div class="form-group">
                <h3>Select image</h3>
                <div class="custom-file">
                    <input type="file" class="custom-file-input" name="image" id="image" required>
                    <!-- <label class="custom-file-label" for="image">Select image...</label> -->
                </div>
            </div>
            <button type="submit" class="btn btn-primary">Upload</button>
        </form>
    </div>
    <script src="{{ url_for('static', filename='jquery/jquery.min.js') }}"></script>
    <script src="{{ url_for('static', filename='popper/popper.min.js') }}"></script>
    <script src="{{ url_for('static', filename='bootstrap/js/bootstrap.min.js') }}"></script>
    <script>
        // Add the following code to make the file name appear on select
        $(".custom-file-input").on("change", function() {
          var fileName = $(this).val().split("\\").pop();
          $(this).siblings(".custom-file-label").addClass("selected").text(fileName);
        });
    </script>
</body>
</html>
